[build]
  command = """
  # Install latest stable Flutter
  git clone https://github.com/flutter/flutter.git -b stable --depth 1 &&
  export PATH="$PATH:$PWD/flutter/bin" &&
  
  # Build
  flutter clean &&
  flutter pub get &&
  flutter build web --release
  """
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[build.cache]]
  path = "flutter"